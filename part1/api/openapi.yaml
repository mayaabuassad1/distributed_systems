openapi: 3.0.3
# ---------------------------------------------------------------------------
# STEP 1 — Service semantics as an OpenAPI document.
#
# Edit this file in the Swagger Editor (/editor once the server runs, or
# https://editor.swagger.io) and fix every warning. Then `make gen-rest`.
#
# This file describes the running EXAMPLE, a key-value store. Students do
# not implement it: replace it with your own service, keeping the structure:
#   * every operation has an operationId  -> becomes a Go method name
#   * reusable pieces live in components (schemas, parameters, responses)
#   * reads take a `consistency` query parameter
#   * errors are application/problem+json (RFC 9457)
# ---------------------------------------------------------------------------
info:
  title: Game Leaderboard
  version: 1.0.0
  description: |
    One game's leaderboard: unique player IDs, names and non-negative scores.
    New players start at zero.
    Reads choose sequential or linearizable consistency.
    All writes are linearizable.
servers:
  - url: /
    description: Current node
tags:
  - name: leaderboard
    description: Read several players, increment scores atomically, or clear the leaderboard
  - name: player
    description: Create, read, increment the score of, or delete one player
paths:
  /v1/players:
    get:
      tags: [leaderboard]
      operationId: listPlayers
      summary: Read selected players or the whole leaderboard
      description: |
        Omit id for all players, or repeat id to select players. Unknown IDs are
        skipped. Duplicates appear once. Sort by score descending, breaking ties
        by ID ascending. Apply limit after sorting.
      parameters:
        - name: id
          in: query
          description: Repeat for several IDs
          style: form
          explode: true
          schema: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        - name: limit
          in: query
          description: Maximum results. Zero or absent means unlimited
          schema: { type: integer, format: int32, minimum: 0 }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Players in leaderboard order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerList' }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [player]
      operationId: createPlayer
      summary: Join with a new player and score zero
      description: Names do not need to be unique. An existing ID returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPlayer' }
      responses:
        '201':
          description: Created player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [leaderboard]
      operationId: incrementPlayers
      summary: Increment several scores atomically (read-modify-write)
      description: |
        All or nothing: each ID must exist and occur once. Increments must be
        positive integers and must not overflow int64. Results follow request
        order. Linearizable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreBatch' }
      responses:
        '200':
          description: Updated players in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerList' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [leaderboard]
      operationId: clearLeaderboard
      summary: Clear all players when the game ends
      description: Idempotent. Succeeds even when empty.
      responses:
        '204': { description: Leaderboard cleared }
        default: { $ref: '#/components/responses/Problem' }
  /v1/players/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      tags: [player]
      operationId: getPlayer
      summary: Read one player by ID
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [player]
      operationId: incrementPlayer
      summary: Increment one player's score (read-modify-write)
      description: |
        Linearizable. Player must exist. Increment must be positive and must not
        overflow int64.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreIncrement' }
      responses:
        '200':
          description: Updated player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [player]
      operationId: deletePlayer
      summary: Remove one player
      description: Idempotent. Unknown players also return 204.
      responses:
        '204': { description: Player removed }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Consistency:
      name: consistency
      in: query
      description: Read consistency, enforced from Part III
      schema: { $ref: '#/components/schemas/Consistency' }
  responses:
    Problem:
      description: RFC 9457 error details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential
    Player:
      type: object
      required: [id, name, score]
      properties:
        id: { type: string }
        name: { type: string }
        score: { type: integer, format: int64, minimum: 0 }
    PlayerList:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items: { $ref: '#/components/schemas/Player' }
    NewPlayer:
      type: object
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
    ScoreIncrement:
      type: object
      required: [increment]
      properties:
        increment: { type: integer, format: int64, minimum: 1 }
    ScoreChange:
      type: object
      required: [id, increment]
      properties:
        id: { type: string, minLength: 1 }
        increment: { type: integer, format: int64, minimum: 1 }
    ScoreBatch:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ScoreChange' }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string, description: 'Short summary, e.g. "Not Found"' }
        status: { type: integer, description: The HTTP status code }
        detail: { type: string, description: What went wrong in this case }
